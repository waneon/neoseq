name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

# One job per verification tier, so a failure names its tier and no tier's
# timing depends on another tier's compilation load.
jobs:
  verify:
    name: ${{ matrix.tier }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: check
            command: devenv tasks run gate:check
          - tier: rust
            command: devenv tasks run gate:rust
          - tier: component
            command: devenv tasks run gate:component
          - tier: browser
            command: devenv --profile browser tasks run gate:browser
            # Not yet blocking: this tier has not run on Linux runners since the
            # journeys were rewritten. Promote it once its runs are reliably green.
            advisory: true
    continue-on-error: ${{ matrix.advisory == true }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install nix
        uses: cachix/install-nix-action@v31

      - name: Cache nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.tier }}-${{ hashFiles('devenv.lock', 'devenv.yaml', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.tier }}-

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      # Dependency builds per tier. The key reads the devenv toolchain, not the
      # runner's; only main saves, so branches cannot evict its entries.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.tier }}
          cmd-format: devenv shell -- {0}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run ${{ matrix.tier }} tier
        run: ${{ matrix.command }}

      - name: Upload browser report
        if: ${{ always() && matrix.tier == 'browser' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/client/playwright-report
            apps/client/test-results
          if-no-files-found: ignore
          retention-days: 14
