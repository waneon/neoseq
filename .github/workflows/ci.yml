name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Run Nix flake checks
        run: nix flake check --print-build-logs --keep-failed

      - name: Collect Playwright failure artifacts
        if: ${{ failure() }}
        run: |
          mkdir -p artifacts/playwright
          {
            for build_root in /nix/var/nix/builds /tmp; do
              if sudo test -d "$build_root"; then
                sudo find "$build_root" \
                  -type d \
                  -path '*/source/apps/client/test-results' \
                  -print0
              fi
            done
          } \
            | while IFS= read -r -d '' results_dir; do
                sudo cp -R "$results_dir"/. artifacts/playwright/
              done
          sudo chmod -R a+rX artifacts/playwright
          if ! compgen -G 'artifacts/playwright/*' > /dev/null; then
            echo '::error::Playwright artifacts were not found in any retained Nix build directory.'
            exit 1
          fi

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/playwright
          if-no-files-found: warn
          retention-days: 14
