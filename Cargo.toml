[workspace]
resolver = "2"
members = [
  "crates/benchmarks",
  "crates/domain",
  "crates/graph-core",
  "crates/platform-native",
  "crates/platform-web",
  "crates/query",
  "crates/sync-protocol",
  "crates/sync-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
criterion = "0.8.2"
hex = "0.4"
loro = "=1.13.7"
oxigraph = { version = "=0.5.9", default-features = false, features = ["js"] }
postcard = { version = "1.1", features = ["alloc"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
spargebra = "=0.4.6"
thiserror = "2.0"
wasm-bindgen = "=0.2.121"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
