[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/graph-core",
  "crates/platform-native",
  "crates/platform-web",
  "crates/query",
  "crates/sync-protocol",
  "crates/sync-server",
  "apps/client/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
futures-util = "0.3"
hex = "0.4"
loro = "=1.13.7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.27"
url = "2.5"
wasm-bindgen = "=0.2.121"
