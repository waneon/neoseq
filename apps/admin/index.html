<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#26272c" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Neoseq Sync Administration</title>
    <!--
      Applies the stored appearance choice before first paint, so an explicit
      Light or Dark preference does not flash the other one first. "system"
      stores nothing and leaves mode resolution to the media query in `app.css`,
      which is the only place a mode is ever decided.
    -->
    <script>
      try {
        var t = localStorage.getItem("neoseq.admin.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
        }
      } catch (_) {
        /* storage unavailable (private mode) — the OS preference still applies */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
