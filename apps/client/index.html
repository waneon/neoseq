<!doctype html>
<!--
  `spellcheck="false"` is inherited by every descendant, which is the whole point:
  the browser's dictionary has no entry for a page name, a tag, a property key or
  a SPARQL variable, so in a document made of short graph references it produced a
  page of red underlines that were never mistakes. One declaration at the root,
  rather than an attribute on each of a dozen authoring surfaces — and on the next
  one somebody adds.
-->
<html lang="en" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11100f" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Neoseq</title>
    <!--
      Applies the stored appearance choices before first paint, so neither an
      explicit Light or Dark preference nor a chosen accent hue flashes the
      default first. "system" stores nothing and leaves mode resolution to the CSS
      media query, which is the only place a theme is ever decided; the hue is one
      number, and `app.css` turns it into every colour derived from the accent.
    -->
    <script>
      try {
        var t = localStorage.getItem("neoseq.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
        }
        var h = Number(localStorage.getItem("neoseq.accent-hue"));
        if (Number.isFinite(h) && h > 0) {
          document.documentElement.style.setProperty("--accent-h", String(h % 360));
        }
      } catch (_) {
        /* storage unavailable (private mode) — the OS preference still applies */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
