<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>NeoSeq</title>
    <!--
      Applies a stored theme choice before first paint so an explicit Light or
      Dark preference never flashes the other mode. "system" stores nothing and
      leaves resolution to the CSS media query, which is the only place a theme
      is ever decided.
    -->
    <script>
      try {
        var t = localStorage.getItem("neoseq.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
        }
      } catch (_) {
        /* storage unavailable (private mode) — the OS preference still applies */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
