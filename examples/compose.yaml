services:
  neoseq:
    image: waneon/neoseq:latest
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      - "8080:8080" # Publish the client and synchronization API.
      - "8081:8081" # Publish the administration dashboard.
    environment:
      # Create this administrator only when no active administrator exists.
      NEOSEQ_BOOTSTRAP_ADMIN_USERNAME: "admin"
      NEOSEQ_BOOTSTRAP_ADMIN_PASSWORD: "change-me-later"
      # A direct initial password is optional; the file below takes precedence.
      # NEOSEQ_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/admin-password

      # Embedded PostgreSQL is used when neither variable is set. Set exactly
      # one to use an external PostgreSQL database instead.
      # DATABASE_URL: "postgresql://neoseq:password@postgres/neoseq"
      # DATABASE_URL_FILE: /run/secrets/database-url
    volumes:
      # Persist the embedded database and appliance state.
      - neoseq-data:/var/lib/neoseq
      # Keep logical backups outside the application data volume. Write one with
      #   docker compose exec neoseq \
      #     neoseq-appliance backup /backups/neoseq-$(date +%F).dump
      - neoseq-backups:/backups
    # secrets:
    #   # Mount the initial administrator password read-only.
    #   - admin-password

# secrets:
#   admin-password:
#     # Load the initial administrator password created beside this file.
#     file: ./admin-password.txt

volumes:
  neoseq-backups:
  neoseq-data:
