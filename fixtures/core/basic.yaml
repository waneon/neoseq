graph_id: basic-graph
peer_id: 1
commands:
  - op: ensure_page
    page_id: home
    title: Home
  - op: ensure_page
    page_id: projects
    title: Projects
  - op: ensure_tag
    tag_id: project
    name: Project
  - op: ensure_journal
    date: 2026-08-03
    as_id: journal
  - op: set_tag_default
    tag_id: project
    key: builtin.task-status
    value: { type: string, value: todo }
  - op: set_tag_default
    tag_id: project
    key: custom.reviewed
    value: { type: checkbox, value: false }
  - op: insert_block
    as_id: root
    page_id: home
    markdown: "# Neoseq"
  - op: insert_block
    as_id: first
    page_id: home
    index: 1
    markdown: First child
  - op: indent_block
    block: first
  - op: insert_block
    as_id: second
    page_id: home
    parent: root
    index: 1
    markdown: Second child
  - op: edit_markdown
    block: second
    markdown: "Second child **edited**"
  - op: outdent_block
    block: first
  - op: move_block
    block: first
    page_id: home
    parent: root
    index: 0
  - op: set_property
    entity: block:first
    key: builtin.query
    value: { type: query, value: { language: sparql-1.1/neoseq-v1, source: "builtin.task-status = todo" } }
  - op: set_property
    entity: block:first
    key: builtin.priority
    value: { type: string, value: high }
  - op: set_property
    entity: block:first
    key: builtin.scheduled
    value: { type: date, value: 2026-08-04 }
  - op: set_property
    entity: block:first
    key: builtin.deadline
    value: { type: date, value: 2026-08-05 }
  - op: set_property
    entity: block:first
    key: custom.estimate
    value: { type: number, value: 2.5 }
  - op: set_property
    entity: block:first
    key: custom.owner
    value: { type: page, value: home }
  - op: add_tag
    block: first
    tag_id: project
  - op: remove_property
    entity: block:first
    key: custom.estimate
  - op: undo
  - op: redo
peers:
  - peer_id: 11
    commands:
      - op: splice_markdown
        block: first
        index: 0
        insert: "[left] "
      - op: move_block
        block: second
        page_id: home
        index: 0
      - op: set_property
        entity: block:first
        key: builtin.task-status
        value: { type: string, value: doing }
      - op: ensure_journal
        date: 2026-08-04
  - peer_id: 12
    commands:
      - op: splice_markdown
        block: first
        index: 0
        insert: "[right] "
      - op: delete_block
        block: second
      - op: remove_property
        entity: block:first
        key: builtin.task-status
      - op: ensure_journal
        date: 2026-08-04
